  updated: 2026-11-12
  owner: ec-sim
  note: "所有设备均为【兼容仿真】，身份使用我方自有 Vendor ID；名称带 SIMULATED。"

# 优先级：P0 = 先做（做出来就能演示/收费）；P1 = 第二波；P2 = 长尾
devices:
  # ---------- IO / 端子 ----------
  - id: beckhoff-el2008
    brand: Beckhoff
    model: EL2008
    kind: io-output
    priority: P0
    status: planned
    why: "8 路数字输出，最常见端子；声明式即可实现，是验证插件闭环的最佳样品"
    need: "SM2 布局、0x7000 PDO 映射、默认 0x1C12/0x1600 映射、AL/DC 声明"
