# 设备插件研究清单
# 状态：planned（未开始）→ researching（收集中）→ ready（可上架）→ blocked（法律/技术原因不做）
# 规则：docs/DEVICE-PLUGINS.md。红线：不复制厂商文件入库、不用厂商 VID/PID/Logo、不宣称认证。

meta:
  updated: 2026-11-12
  owner: ec-sim
  note: "所有设备均为【兼容仿真】，身份使用我方自有 Vendor ID；名称带 SIMULATED。"

# 优先级：P0 = 先做（做出来就能演示/收费）；P1 = 第二波；P2 = 长尾
devices:
  # ---------- IO / 端子 ----------
  - id: beckhoff-el2008
    brand: Beckhoff
    model: EL2008
    kind: io-output
    priority: P0
    status: ready
    why: "8 路数字输出，最常见端子；声明式即可实现，是验证插件闭环的最佳样品"
    need: "SM2 布局、0x7000 PDO 映射、默认 0x1C12/0x1600 映射、AL/DC 声明"
    deliverable: "plugins/beckhoff-el2008/（manifest + facts.md + README.md），验证记录 docs/plugins/beckhoff-el2008-verification.md"
  - id: beckhoff-el1008
    brand: Beckhoff
    model: EL1008
    kind: io-input
    priority: P0
    status: planned
    why: "8 路数字输入，与 EL2008 成对使用"
    need: "SM3 布局、0x6000 映射、默认 0x1C13/0x1A00"
  - id: wago-750-354
    brand: WAGO
    model: 750-354
    kind: io
    priority: P1
    status: planned
  - id: turck-tben-l
    brand: Turck
    model: TBEN-L
    kind: io
    priority: P2
    status: planned

  # ---------- 伺服（CiA402） ----------
  - id: generic-cia402-servo
    brand: Generic
    model: CiA402
    kind: servo
    priority: P0
    status: ready
    why: "通用 CiA 402 伺服画像：先验证声明式画像 + 双主站闭环，再派生具体厂商兼容画像"
    need: "典型 DS402 默认 PDO（0x6040/0x6060/0x607A、0x6041/0x6061/0x6064）、CoE 邮箱、SM2/SM3 布局"
    deliverable: "plugins/generic-cia402-servo/（manifest + facts.md + README.md），验证记录 docs/plugins/generic-cia402-verification.md"
  - id: generic-cia402-csv-servo
    brand: Generic
    model: CiA402-CSV
    kind: servo
    priority: P0
    status: ready
    why: "通用 CiA 402 CSV（速度模式）画像：11 字节 PDO，验证速度模式 Tier0 行为"
    need: "0x60FF 目标速度 / 0x606C 实际速度、11 字节 RxPDO/TxPDO、CSV 模式行为"
    deliverable: "plugins/generic-cia402-csv-servo/（manifest + facts.md + README.md），验证脚本 scripts/spikes/cia402-csv-probe.sh"
  - id: generic-cia402-cst-servo
    brand: Generic
    model: CiA402-CST
    kind: servo
    priority: P0
    status: ready
    why: "通用 CiA 402 CST（转矩模式）画像：5 字节 PDO，验证转矩模式 Tier0 行为"
    notes: "Tier0：Operation enabled 时 0x6077 镜像 0x6071，不模拟转矩环/负载"
    deliverable: "plugins/generic-cia402-cst-servo/（manifest + facts.md），验证脚本 scripts/spikes/cia402-cst-probe.sh"
  - id: cnc-csp-servo
    brand: Generic
    model: CiA402-CSP
    kind: servo
    priority: P0
    status: ready
    why: "CNC 虚拟闭环（LinuxCNC + lcec + IgH + TAP）用画像：RxPDO 7B（6040/6060/607A）、TxPDO 11B（6041/6061/6064/606C），与 lcec basic_cia402 的 PP/CSP 期望一致"
    need: "lcec enableCSP 隐式要求 TxPDO 含 0x606C；0x6040/0x6041 为 Rx/Tx 第一项"
    deliverable: "plugins/cnc-csp-servo/（manifest + facts.md + README.md），对接说明 docs/plan/CNC-V1-integration.md，TAP 多从站探针 scripts/spikes/tap-cia402-multi-slave-probe.sh"
  - id: inovance-sv660n
    brand: Inovance
    model: SV660N
    kind: servo
    priority: P0
    status: researching
    deliverable: "plugins/inovance-sv660n/（plugin.yaml + facts.md + README.md），验证记录 docs/plugins/inovance-sv660n-verification.md；⚠️ 默认 PDO/扩展对象待按公开手册核实"
    why: "国内 LinuxCNC/EtherCAT 用量最大的伺服之一；做出来就是市场刚需"
    need: "默认 RPDO/TPDO 映射、CSP/CSV 模式对象、状态字/控制字行为、DC 参数、错误码"
