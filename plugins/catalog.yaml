    brand: Beckhoff
    model: EL1008
    kind: io-input
    priority: P0
    status: planned
    why: "8 路数字输入，与 EL2008 成对使用"
    need: "SM3 布局、0x6000 映射、默认 0x1C13/0x1A00"
