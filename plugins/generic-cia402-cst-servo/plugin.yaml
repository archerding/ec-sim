# EC-Sim 声明式设备插件：**通用 CiA 402 CST 伺服（SIMULATED）**（B11：转矩模式）
#
# 合规说明（docs/DEVICE-PLUGINS.md R1–R5）：只使用公开 CiA 402 对象/PDO 结构；
# 未入库厂商 ESI/PDF/固件（R1）；自有 VID/PID（R2）；名称带 SIMULATED；不声称认证（R3）。
#
# 5 字节 RxPDO/TxPDO 的 CST（Cyclic Synchronous Torque）画像：
#   RxPDO 0x1600: 0x6040 controlword(16) + 0x6060 modes(8) + 0x6071 target torque(16) = 5 字节
#   TxPDO 0x1A00: 0x6041 statusword(16)  + 0x6061 modes display(8) + 0x6077 torque actual(16) = 5 字节
schema: ecsim.plugin/v1
id: com.ecsim.profile.cia402-cst-servo
name: "Generic CiA 402 CST servo (SIMULATED)"
version: 0.1.0
kind: device
license: Apache-2.0 OR MIT
pricing: {model: free, amount: 0, currency: CNY}

compatibility:
  brands: ["Generic"]
  models: ["CiA402-CST"]
  disclaimer: "Independent re-implementation from the public CiA 402 profile. Not affiliated with, endorsed by, or certified by any vendor."

identity:
  vendor_id: 0x00000EC5
  product_code: 0x0000E5E2
  revision: 0x00010000
  simulated: true

profile: cia402
mailbox:
  coe: {sdo: true, sdo_info: true, complete_access: true}

sm:
  - {index: 0, dir: mbox-in,  start: 0x1000, len: 128}
  - {index: 1, dir: mbox-out, start: 0x1080, len: 128}
  - {index: 2, dir: out,      start: 0x1100, len: 5}
  - {index: 3, dir: in,       start: 0x1110, len: 5}

pdo:
  rx:
    - index: 0x1600
      entries:
        - {index: 0x6040, sub: 0, bits: 16}
        - {index: 0x6060, sub: 0, bits: 8}
        - {index: 0x6071, sub: 0, bits: 16}
  tx:
    - index: 0x1A00
      entries:
        - {index: 0x6041, sub: 0, bits: 16}
        - {index: 0x6061, sub: 0, bits: 8}
        - {index: 0x6077, sub: 0, bits: 16}

objects:
  - {index: 0x1008, sub: 0, name: Device name, dtype: VISIBLE_STRING, access: ro, value: "Generic CiA 402 CST servo (SIMULATED)"}
  - {index: 0x6502, sub: 0, name: Supported drive modes, dtype: UINT32, access: ro, value: 0x3AD}
  - {index: 0x6040, sub: 0, name: Controlword, dtype: UINT16, access: rw, value: 0x0000, pdo: rx}
  - {index: 0x6041, sub: 0, name: Statusword, dtype: UINT16, access: ro, value: 0x0000, pdo: tx}
  - {index: 0x603F, sub: 0, name: Error code, dtype: UINT16, access: ro, value: 0x0000}
  - {index: 0x6060, sub: 0, name: Modes of operation, dtype: INT8, access: rw, value: 0, pdo: rx}
  - {index: 0x6061, sub: 0, name: Modes of operation display, dtype: INT8, access: ro, value: 0, pdo: tx}
  - {index: 0x6071, sub: 0, name: Target torque, dtype: INT16, access: rw, value: 0, pdo: rx}
  - {index: 0x6077, sub: 0, name: Torque actual value, dtype: INT16, access: ro, value: 0, pdo: tx}

dc: {supported: false, sync0: false}

sources:
  - {title: "CiA — CiA 402 servo drive profile（公开规范摘要）", url: "https://www.can-cia.org/cia-402", accessed: "2026-11-13"}
  - {title: "EtherCAT Technology Group — EtherCAT 规范/设备 profile（ETG.1000）", url: "https://www.ethercat.org/", accessed: "2026-11-13"}
