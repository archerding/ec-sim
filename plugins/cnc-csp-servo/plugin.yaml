# EC-Sim 声明式设备插件：**CNC 虚拟闭环用 CSP 伺服画像（SIMULATED）**（2026-11-13 团队班）
#
# 目的：给 CNC Station 虚拟闭环 V2/V3（LinuxCNC + linuxcnc-ethercat `basic_cia402` + IgH）
# 一块**PDO 布局与 lcec 期望一致**的 CiA 402 从站，用于 HAL 轴 jog/MDI/Home 的 PDO 双向可见性验证。
#
# 布局依据（cnc-impl 2026-11-13 对 lcec c6f8820 源码的核对，属事实记录，不构成任何认证）：
#   - lcec `enableCSP` 会隐式要求 TxPDO 含 0x606C:00 S32（实际速度）；
#   - 0x6040/0x6041 必须分别是 RxPDO/TxPDO 的第一项；条目必须真实出现在
#     0x1600/0x1A00 映射对象里（lcec 按从站映射对象读回匹配，不只看 SM 长度）。
# 合规（docs/DEVICE-PLUGINS.md R1–R5）：只用公开 CiA 402 对象/PDO 结构；未入库任何厂商
# ESI/PDF/固件（R1）；身份用**我方自有** VID/PID（R2）；名称带 SIMULATED，不宣称兼容/认证（R3/R4）。
schema: ecsim.plugin/v1
id: com.ecsim.profile.cnc-csp-servo
name: "CNC virtual-loop CSP servo (SIMULATED)"
version: 0.1.0
kind: device
license: Apache-2.0 OR MIT
pricing: {model: free, amount: 0, currency: CNY}

compatibility:
  brands: ["Generic"]
  models: ["CiA402-CSP"]
  disclaimer: "Independent re-implementation from the public CiA 402 profile for a virtual acceptance loop. Not affiliated with, endorsed by, or certified by any vendor, CiA, ETG or LinuxCNC."

identity:
  vendor_id: 0x00000EC5
  product_code: 0x0000E5E3
  revision: 0x00010000
  simulated: true

profile: cia402
mailbox:
  coe: {sdo: true, sdo_info: true, complete_access: true}

# SM2（RxPDO，主站→从站）7 字节：0x6040 + 0x6060 + 0x607A
# SM3（TxPDO，从站→主站）11 字节：0x6041 + 0x6061 + 0x6064 + 0x606C
# （TxPDO 比 7 字节通用画像多 0x606C 实际速度；lcec CSP 要求的隐式条目）
sm:
  - {index: 0, dir: mbox-in,  start: 0x1000, len: 128}
  - {index: 1, dir: mbox-out, start: 0x1080, len: 128}
  - {index: 2, dir: out,      start: 0x1100, len: 7}
  - {index: 3, dir: in,       start: 0x1110, len: 11}

pdo:
  rx:
    - index: 0x1600
      entries:
        - {index: 0x6040, sub: 0, bits: 16}
        - {index: 0x6060, sub: 0, bits: 8}
        - {index: 0x607A, sub: 0, bits: 32}
  tx:
    - index: 0x1A00
      entries:
        - {index: 0x6041, sub: 0, bits: 16}
        - {index: 0x6061, sub: 0, bits: 8}
        - {index: 0x6064, sub: 0, bits: 32}
        - {index: 0x606C, sub: 0, bits: 32}

objects:
  - {index: 0x1008, sub: 0, name: Device name, dtype: VISIBLE_STRING, access: ro, value: "CNC virtual-loop CSP servo (SIMULATED)"}
  # 7 字节 RxPDO 支持的 Tier0 模式：pp(1)/hm(6)/ip(7)/csp(8) → 0x01C1（与 lcec PP/CSP 一致）
  - {index: 0x6502, sub: 0, name: Supported drive modes, dtype: UINT32, access: ro, value: 0x01C1}
  - {index: 0x603F, sub: 0, name: Error code, dtype: UINT16, access: ro, value: 0x0000}
  - {index: 0x6040, sub: 0, name: Controlword, dtype: UINT16, access: rw, value: 0x0000, pdo: rx}
  - {index: 0x6041, sub: 0, name: Statusword, dtype: UINT16, access: ro, value: 0x0000, pdo: tx}
  - {index: 0x6060, sub: 0, name: Modes of operation, dtype: INT8, access: rw, value: 0, pdo: rx}
  - {index: 0x6061, sub: 0, name: Modes of operation display, dtype: INT8, access: ro, value: 0, pdo: tx}
  - {index: 0x6064, sub: 0, name: Position actual value, dtype: INT32, access: ro, value: 0, pdo: tx}
  - {index: 0x606C, sub: 0, name: Velocity actual value, dtype: INT32, access: ro, value: 0, pdo: tx}
  - {index: 0x607A, sub: 0, name: Target position, dtype: INT32, access: rw, value: 0, pdo: rx}
  - {index: 0x2100, sub: 0, name: Config string, dtype: VISIBLE_STRING, access: rw, value: `EC-Sim CNC CSP config (SIMULATED)`}

# 虚拟闭环 V1/V2 不配置 DC（lcec XML 无 <dcConf>；模拟器只有 Tier0 帧驱动时钟）。
dc: {supported: false, sync0: false}

sources:
  - {title: "CiA — CiA 402 servo drive profile（公开规范摘要）", url: "https://www.can-cia.org/cia-402", accessed: "2026-11-13"}
  - {title: "EtherCAT Technology Group — EtherCAT 规范/设备 profile（ETG.1000）", url: "https://www.ethercat.org/", accessed: "2026-11-13"}
  - {title: "linuxcnc-ethercat（lcec）公开源码：basic_cia402 的 PP/CSP PDO 期望（只读参考，未复制代码）", url: "https://github.com/linuxcnc-ethercat/linuxcnc-ethercat", accessed: "2026-11-13"}
