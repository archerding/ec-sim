# EC-Sim 声明式设备插件：**通用 CiA 402 伺服驱动（SIMULATED）**（B11 第一步）
#
# 合规说明（docs/DEVICE-PLUGINS.md R1–R5）：
# - 只用公开规范/公开手册中的**接口事实**（CiA 402 对象索引、默认 PDO 结构），未把任何
#   厂商 ESI/PDF/固件/示例代码入库（R1）；facts.md 只记录公开来源 URL。
# - 设备身份使用**我方自有** Vendor ID / Product Code（R2），名称带 SIMULATED。
# - 不宣称与任何厂商存在隶属、背书或认证关系（R3）；本画像不与具体厂商型号绑定。
# - 这是"通用 CiA 402 画像"：先用它验证声明式画像 + 双主站闭环，再据此派生
#   Inovance SV660N 等具体兼容画像（见 plugins/catalog.yaml）。
schema: ecsim.plugin/v1
id: com.ecsim.profile.cia402-servo
name: "Generic CiA 402 position/velocity servo (SIMULATED)"
version: 0.1.0
kind: device
license: Apache-2.0 OR MIT
pricing: {model: free, amount: 0, currency: CNY}

compatibility:
  brands: ["Generic"]
  models: ["CiA402"]
  disclaimer: "Independent re-implementation from the public CiA 402 profile and public EtherCAT documentation. Not affiliated with, endorsed by, or certified by any vendor or by CiA."

identity:
  vendor_id: 0x00000EC5
  product_code: 0x0000E5E0
  revision: 0x00010000
  simulated: true

profile: cia402
mailbox:
  coe: {sdo: true, sdo_info: true, complete_access: true}

# 典型 CiA 402 伺服：SM0/SM1 = CoE 邮箱，SM2 = RxPDO（主站→从站 7 字节），
# SM3 = TxPDO（从站→主站 7 字节）。
sm:
  - {index: 0, dir: mbox-in,  start: 0x1000, len: 128}
  - {index: 1, dir: mbox-out, start: 0x1080, len: 128}
  - {index: 2, dir: out,      start: 0x1100, len: 7}
  - {index: 3, dir: in,       start: 0x1110, len: 7}

# 公开资料中的典型 DS402 默认映射（各家略有差异，作为"通用画像"的默认值）：
#   RxPDO 0x1600: 0x6040 controlword(16) + 0x6060 modes(8) + 0x607A target position(32)
#   TxPDO 0x1A00: 0x6041 statusword(16)  + 0x6061 modes display(8) + 0x6064 position actual(32)
pdo:
  rx:
    - index: 0x1600
      entries:
        - {index: 0x6040, sub: 0, bits: 16}
        - {index: 0x6060, sub: 0, bits: 8}
        - {index: 0x607A, sub: 0, bits: 32}
  tx:
    - index: 0x1A00
      entries:
        - {index: 0x6041, sub: 0, bits: 16}
        - {index: 0x6061, sub: 0, bits: 8}
        - {index: 0x6064, sub: 0, bits: 32}

objects:
  - {index: 0x1008, sub: 0, name: Device name, dtype: VISIBLE_STRING, access: ro, value: "Generic CiA 402 servo (SIMULATED)"}
  # 7 字节布局实际支持的 Tier0 模式：pp(1)/hm(6)/ip(7)/csp(8) → 0x01C1
  - {index: 0x6502, sub: 0, name: Supported drive modes, dtype: UINT32, access: ro, value: 0x01C1}
  - {index: 0x6040, sub: 0, name: Controlword, dtype: UINT16, access: rw, value: 0x0000, pdo: rx}
  - {index: 0x6041, sub: 0, name: Statusword, dtype: UINT16, access: ro, value: 0x0000, pdo: tx}
  - {index: 0x603F, sub: 0, name: Error code, dtype: UINT16, access: ro, value: 0x0000}
  - {index: 0x6060, sub: 0, name: Modes of operation, dtype: INT8, access: rw, value: 0, pdo: rx}
  - {index: 0x6061, sub: 0, name: Modes of operation display, dtype: INT8, access: ro, value: 0, pdo: tx}
  - {index: 0x6064, sub: 0, name: Position actual value, dtype: INT32, access: ro, value: 0, pdo: tx}
  - {index: 0x6077, sub: 0, name: Torque actual value, dtype: INT16, access: ro, value: 0}
  - {index: 0x2100, sub: 0, name: Config string, dtype: VISIBLE_STRING, access: rw, value: `EC-Sim SDO config (SIMULATED)`}
  - {index: 0x607A, sub: 0, name: Target position, dtype: INT32, access: rw, value: 0, pdo: rx}

# 通用画像不声明 DC（真实伺服通常支持 DC；先用无 DC 的最小闭环，后续再补）。
dc: {supported: false, sync0: false}

sources:
  - {title: "CiA — CANopen device profile CiA 402 (servo drive profile)", url: "https://www.can-cia.org/cia-402", accessed: "2026-11-12"}
  - {title: "EtherCAT Technology Group — EtherCAT device profiles (ETG.6010)", url: "https://www.ethercat.org/", accessed: "2026-11-12"}
  - {title: "Public servo manual — DS402 object list (controlword/statusword/target position)", url: "https://www.invt.com.cn/", accessed: "2026-11-12"}
